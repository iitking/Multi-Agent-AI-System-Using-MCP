version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: enterprise_agent_backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - API_KEYS=dev-admin-key:admin:admin,dev-analyst-key:analyst:analyst,dev-viewer-key:viewer:viewer
      - ANALYTICS_DATABASE_URL=sqlite:////app/data/sales.db
      - APP_DATABASE_URL=sqlite:////app/data/app.db
      - CORS_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/sales-action
      - N8N_WEBHOOK_SECRET=secret_n8n_token_123
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - LANGSMITH_TRACING=${LANGSMITH_TRACING:-false}
      - LANGSMITH_API_KEY=${LANGSMITH_API_KEY:-}
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: enterprise_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: enterprise_agent_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NEXT_PUBLIC_DEFAULT_API_KEY=dev-admin-key
    depends_on:
      backend:
        condition: service_healthy

volumes:
  n8n_data:
